[project]
name = "sprint14"
version = "0.1.0"
description = "Sprint 14"
requires-python = ">=3.7,<3.8"
dependencies = [
    "numpy==1.21.6",
    "pandas==1.2.4",
    "scipy==1.7.3",
    "scikit-learn==0.24.1",
    "joblib==0.16.0",
    "matplotlib==3.5.3",
    "seaborn==0.11.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
